plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.20'
}

def keystorePath = System.getenv("SHADOWFOX_KEYSTORE_PATH")
def signingPassword = System.getenv("SHADOWFOX_SIGNING_PASSWORD")

android {
    namespace 'ca.shadowfoxtv.taskkiller'
    compileSdk 35

    defaultConfig {
        applicationId "ca.shadowfoxtv.taskkiller"
        minSdk 23
        targetSdk 35
        versionCode 44
        versionName "5.2.10"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        if (keystorePath && signingPassword) {
            release {
                storeFile file(keystorePath)
                storePassword signingPassword
                keyAlias "shadowfox"
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def releaseSigning = signingConfigs.findByName("release")
            if (releaseSigning != null) signingConfig releaseSigning
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def hdLogoSource = file("${rootProject.projectDir}/../logo_src/shadowfox_logo_512.b64")
def hdLogoDir = file("src/main/res/drawable-nodpi")
def hdLogoFile = file("src/main/res/drawable-nodpi/shadowfox_logo.webp")

tasks.register("prepareShadowFoxHdLogo") {
    inputs.file(hdLogoSource)
    outputs.file(hdLogoFile)
    doLast {
        if (!hdLogoSource.exists()) {
            throw new GradleException("Missing staged ShadowFox HD logo source")
        }
        hdLogoDir.mkdirs()
        hdLogoDir.listFiles()?.findAll { it.name.toLowerCase().startsWith("shadowfox_logo.") }?.each { it.delete() }
        hdLogoFile.bytes = hdLogoSource.text.trim().decodeBase64()
        println "Using supplied ShadowFox HD logo: ${hdLogoFile.length()} bytes"
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareShadowFoxHdLogo")
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}

// v5.2.10 isolated mobile/TV launcher build trigger
