plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.20'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.20'
}

def keystorePath = System.getenv("SHADOWFOX_KEYSTORE_PATH")
def signingPassword = System.getenv("SHADOWFOX_SIGNING_PASSWORD")

android {
    namespace 'ca.shadowfoxtv.taskkiller'
    compileSdk 35

    defaultConfig {
        applicationId "ca.shadowfoxtv.taskkiller"
        minSdk 23
        targetSdk 35
        versionCode 30
        versionName "5.1.3"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        if (keystorePath && signingPassword) {
            release {
                storeFile file(keystorePath)
                storePassword signingPassword
                keyAlias "shadowfox"
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def releaseSigning = signingConfigs.findByName("release")
            if (releaseSigning != null) signingConfig releaseSigning
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
