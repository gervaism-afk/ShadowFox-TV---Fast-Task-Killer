name: Build & Release ShadowFox TV - Task Killer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ShadowFoxTV-FastTaskKiller-Project-v3.0.4-NON-ROOT.zip"
      - "overrides/**"
      - "signing/**"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: write

env:
  SHADOWFOX_SIGNING_PASSWORD: ${{ secrets.SHADOWFOX_SIGNING_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract working Android project
        run: |
          mkdir extracted
          unzip -q ShadowFoxTV-FastTaskKiller-Project-v3.0.4-NON-ROOT.zip -d extracted

      - name: Apply ShadowFox v3.3.0 updater files
        run: |
          cp -R overrides/. extracted/.

      - name: Add updater permissions to Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extracted/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
          ]
          marker = '<application'
          additions = '\n'.join(x for x in permissions if x not in text)
          if additions:
              text = text.replace(marker, additions + '\n\n    ' + marker, 1)
              p.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Task-Killer-v3.3.0-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare permanent release signing key
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        run: |
          printf '%s' "$SHADOWFOX_SIGNING_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/shadowfox-release.keystore.enc \
            -out "$RUNNER_TEMP/shadowfox-release.keystore" -pass stdin
          echo "SHADOWFOX_KEYSTORE_PATH=$RUNNER_TEMP/shadowfox-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        working-directory: extracted
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed release artifact
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Task-Killer-v3.3.0-signed
          path: extracted/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release for auto-update
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' extracted/app/build.gradle)
          TAG="v${VERSION}"
          ASSET="ShadowFox-TV-Task-Killer-v${VERSION}.apk"
          cp extracted/app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "ShadowFox TV - Task Killer v${VERSION}" \
              --notes "Automatic signed release for ShadowFox TV - Task Killer v${VERSION}."
          fi

      - name: Signing setup notice
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD == '' }}
        run: |
          echo "::warning::Signed release was skipped. Add the SHADOWFOX_SIGNING_PASSWORD repository secret, then re-run this workflow."
