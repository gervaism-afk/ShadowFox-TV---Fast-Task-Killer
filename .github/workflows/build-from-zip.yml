name: Build & Release ShadowFox TV Optimizer

on:
  workflow_dispatch:
  push:
    branches: [main, v6.3.1-mobile-device-polish, android-tv-reference-ui, shadowfox-v6-ultimate, v6.0.3-layout-final, h96-diagnostic-build, h96-anr-fix-v6.1.10, ui-focus-v6.1.11, ultimate-dpad-unified-v6.1.12, accuracy-audit-v6.1.13, auto-updater-v6.1.14, production-cleanup-v6.1.16, rollback-v6.2.1-to-v6.1.16, true-ui-rebuild-v6.2.2, v6.3.2-mobile-landscape-fix, v6.4.0-ultimate-center-polish, v6.4.1-ultimate-center-layout-fix, v6.5.0-ultimate-tools-polish, v6.6.0-tv-rebuild, v6.6.1-update-feedback, v6.7.0-tv-metallic-rebuild, v6.7.1-tv-contrast-root-fix, v6.8.0-reference-layout-rebuild, v6.8.1-tv-focus-controls, v6.8.2-optimize-qa-fix, v6.8.3-optimize-state-fix, v6.8.4-optimize-survival-fix, v6.8.5-optimize-service-fix, v6.8.6-optimize-deadlock-fix, v6.8.7-optimize-stale-state-fix, v6.8.8-optimize-race-fix, v6.8.9-optimize-result-ui, v6.8.10-direct-optimize-result, v6.8.11-tv-optimize-results]
    paths: ["overrides/**", "scripts/**", "signing/**", ".github/workflows/build-from-zip.yml"]

permissions:
  contents: write

env:
  SHADOWFOX_SIGNING_PASSWORD: ${{ secrets.SHADOWFOX_SIGNING_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: mkdir extracted && unzip -q ShadowFoxTV-FastTaskKiller-Project-v3.0.4-NON-ROOT.zip -d extracted
      - name: Apply ShadowFox Compose source
        run: |
          cp -R overrides/. extracted/.
          rm -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.java
      - name: Preserve Android TV reference source
        run: |
          test -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
          grep -q 'SMART OPTIMIZE' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
      - name: Verify Android TV presentation layer
        run: |
          grep -q 'SMART OPTIMIZE' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
          grep -q 'ULTIMATE CENTER' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
          grep -q 'THERMAL + PERFORMANCE' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
          grep -q 'CHECK UPDATE' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/UltimateCenterActivity.kt
          grep -q 'shadowfox_tab' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
      - name: Preserve highest-quality ShadowFox logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          res=Path('extracted/app/src/main/res'); exts={'.png','.webp','.jpg','.jpeg'}
          current=[p for p in res.rglob('shadowfox_logo.*') if p.suffix.lower() in exts]
          sources=[(p.stat().st_size,p.read_bytes(),p.name) for p in current]
          z=Path('ShadowFoxTV-FastTaskKiller-Project-v3.0.1-REAL-LOGO.zip')
          if z.exists():
            with zipfile.ZipFile(z) as f:
              for n in f.namelist():
                q=Path(n)
                if q.name.lower().startswith('shadowfox_logo.') and q.suffix.lower() in exts:
                  data=f.read(n); sources.append((len(data),data,q.name))
          if not sources: raise SystemExit('No ShadowFox logo found')
          _,data,name=max(sources,key=lambda x:x[0])
          for q in current:
            if q.exists(): q.unlink()
          dst=res/'drawable-nodpi'/name; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
          print('Using high-resolution logo',name,len(data),'bytes')
          PY
      - name: Read version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' extracted/app/build.gradle)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare release signing
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        run: |
          printf '%s' "$SHADOWFOX_SIGNING_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/shadowfox-release.keystore.enc -out "$RUNNER_TEMP/shadowfox-release.keystore" -pass stdin
          echo "SHADOWFOX_KEYSTORE_PATH=$RUNNER_TEMP/shadowfox-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        working-directory: extracted
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Optimizer-v${{ env.APP_VERSION }}-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed release APK
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Optimizer-v${{ env.APP_VERSION }}
          path: extracted/app/build/outputs/apk/release/app-release.apk
      - name: Publish release
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          TAG="v${APP_VERSION}"; ASSET="ShadowFox-TV-Optimizer-v${APP_VERSION}.apk"
          cp extracted/app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$ASSET" --clobber; else gh release create "$TAG" "$ASSET" --title "ShadowFox TV Optimizer v${APP_VERSION}" --notes "ShadowFox H96 ANR fix build."; fi


