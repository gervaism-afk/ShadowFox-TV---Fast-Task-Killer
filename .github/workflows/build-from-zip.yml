name: Build & Release ShadowFox TV - Task Killer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ShadowFoxTV-FastTaskKiller-Project-v3.0.4-NON-ROOT.zip"
      - "overrides/**"
      - "signing/**"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: write

env:
  SHADOWFOX_SIGNING_PASSWORD: ${{ secrets.SHADOWFOX_SIGNING_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract working Android project
        run: |
          mkdir extracted
          unzip -q ShadowFoxTV-FastTaskKiller-Project-v3.0.4-NON-ROOT.zip -d extracted

      - name: Apply ShadowFox overrides
        run: cp -R overrides/. extracted/.

      - name: Read app version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' extracted/app/build.gradle)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Add updater and v4 manifest entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('extracted/app/src/main/AndroidManifest.xml')
          text = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          additions = '\n'.join(x for x in permissions if x not in text)
          if additions:
              text = text.replace('<application', additions + '\n\n    <application', 1)

          if 'android:name=".ShadowFoxApp"' not in text:
              text = text.replace('<application', '<application android:name=".ShadowFoxApp"', 1)

          # MainActivity remains installed as the legacy update/install center,
          # but v4 becomes the launcher screen.
          activity_pattern = re.compile(r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)(</activity>)', re.S)
          def strip_main_launcher(match):
              body = match.group(2)
              filters = re.findall(r'<intent-filter\b.*?</intent-filter>', body, flags=re.S)
              for f in filters:
                  if 'android.intent.action.MAIN' in f:
                      body = body.replace(f, '')
              return match.group(1) + body + match.group(3)
          text = activity_pattern.sub(strip_main_launcher, text, count=1)

          v4_activity = '''
        <activity
            android:name=".V4DashboardActivity"
            android:exported="true"
            android:screenOrientation="unspecified">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
            </intent-filter>
        </activity>
'''
          if 'android:name=".V4DashboardActivity"' not in text:
              text = text.replace('</application>', v4_activity + '    </application>', 1)

          receivers = ('\n        <receiver android:name=".UpdateCheckReceiver" android:enabled="true" android:exported="false" />\n'
                       '        <receiver android:name=".UpdateBootReceiver" android:enabled="true" android:exported="true">\n'
                       '            <intent-filter>\n'
                       '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                       '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                       '            </intent-filter>\n'
                       '        </receiver>\n')
          if 'android:name=".UpdateBootReceiver"' not in text:
              text = text.replace('</application>', receivers + '    </application>', 1)

          p.write_text(text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Task-Killer-v${{ env.APP_VERSION }}-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare permanent release signing key
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        run: |
          printf '%s' "$SHADOWFOX_SIGNING_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/shadowfox-release.keystore.enc -out "$RUNNER_TEMP/shadowfox-release.keystore" -pass stdin
          echo "SHADOWFOX_KEYSTORE_PATH=$RUNNER_TEMP/shadowfox-release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        working-directory: extracted
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed release artifact
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Task-Killer-v${{ env.APP_VERSION }}-signed
          path: extracted/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release for auto-update
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$APP_VERSION"
          TAG="v${VERSION}"
          ASSET="ShadowFox-TV-Task-Killer-v${VERSION}.apk"
          cp extracted/app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "ShadowFox TV - Task Killer v${VERSION}" --notes "Automatic signed release for ShadowFox TV - Task Killer v${VERSION}."
          fi
