name: Build ShadowFox TV Fast Task Killer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ShadowFoxTV-FastTaskKiller-Project-v3.0.1.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q ShadowFoxTV-FastTaskKiller-Project-v3.0.1.zip -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ShadowFox APK
        working-directory: extracted
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Fast-Task-Killer-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
