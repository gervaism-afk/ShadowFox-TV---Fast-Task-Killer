name: Build & Release ShadowFox TV Optimizer

on:
  workflow_dispatch:
  push:
    branches: [main, shadowfox-v6-ultimate, v6.0.3-layout-final, h96-diagnostic-build, h96-anr-fix-v6.1.10, ui-focus-v6.1.11, ultimate-dpad-unified-v6.1.12, accuracy-audit-v6.1.13, auto-updater-v6.1.14, production-cleanup-v6.1.16, rollback-v6.1.24-from-locked-v6.1.16, fix-v6.1.25-direct-subpage-rewrite, fix-v6.1.26-advanced-tools-direct, fix-v6.1.27-final-generated-ui, fix-v6.1.28-advanced-visual-source, remove-advanced-tools-v6.1.29, unify-ui-v6.1.30]
    paths: ["overrides/**", "scripts/**", "signing/**", ".github/workflows/build-from-zip.yml"]

permissions:
  contents: write

env:
  SHADOWFOX_SIGNING_PASSWORD: ${{ secrets.SHADOWFOX_SIGNING_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: mkdir extracted && unzip -q ShadowFoxTV-FastTaskKiller-Project-v3.0.4-NON-ROOT.zip -d extracted
      - name: Apply ShadowFox Compose source
        run: |
          cp -R overrides/. extracted/.
          rm -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.java
      - name: Apply responsive build patch
        run: python3 scripts/patch_build.py
      - name: Apply final mobile layout correction
        run: python3 scripts/fix_layout_5_2_19.py
      - name: Apply TV bottom and root cleanup fixes
        run: python3 scripts/patch_tv_root.py
      - name: Apply v5.3 Pro Engine integration
        run: python3 scripts/patch_v5_3_pro_engine.py
      - name: Apply v6 Ultimate Center integration
        run: python3 scripts/patch_v6_ultimate.py
      - name: Apply locked v6.0.4 main dashboard layouts
        run: python3 scripts/patch_v6_0_4_final_main_layout.py
      - name: Apply v6.1 advanced feature integration
        run: python3 scripts/patch_v6_1_advanced.py
      - name: Apply v6.1.1 legacy root compatibility
        run: python3 scripts/patch_v6_1_1_root_compat.py
      - name: Apply H96 ANR main-thread fix last
        run: python3 scripts/patch_h96_anr_fix.py
      - name: Apply Ultimate Center TV focus styling last
        run: python3 scripts/patch_ultimate_tab_focus.py
      - name: Verify Advanced Tools removal and final Ultimate UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('extracted/app/src/main')
          forbidden=['AdvancedToolsActivity','ADVANCED APP CONTROL','OPEN ADVANCED TOOLS']
          hits=[]
          for p in base.rglob('*'):
              if p.is_file() and p.suffix in {'.kt','.java','.xml'}:
                  t=p.read_text(errors='ignore')
                  for x in forbidden:
                      if x in t: hits.append(str(p)+': '+x)
          if hits:
              raise SystemExit('Advanced Tools removal audit failed: '+str(hits))
          ult=(base/'java/ca/shadowfoxtv/taskkiller/UltimateCenterActivity.kt').read_text()
          req=['0xFF4D648D','0xFF3A7BD5','0xFF2A52BE','0xFF1A365D','RoundedCornerShape(4.dp)']
          missing=[x for x in req if x not in ult]
          if missing:
              raise SystemExit('Ultimate UI missing: '+str(missing))
          print('REMOVAL AUDIT PASSED: Advanced App Control and Advanced Tools absent')
          PY
      - name: Enforce and audit unified main-page UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('extracted/app/src/main')
          u=base/'java/ca/shadowfoxtv/taskkiller/UltimateCenterActivity.kt'
          t=u.read_text()
          for a,b in [('Color(0xEA092337)','Color(0xFF1E2235)'),('Color(0xFF00E5FF)','Color(0xFF4D648D)'),('Color(0xFF9AABB8)','Color(0xFFB8C3D6)'),('RoundedCornerShape(12.dp)','RoundedCornerShape(4.dp)'),('RoundedCornerShape(50)','RoundedCornerShape(4.dp)')]:
              t=t.replace(a,b)
          u.write_text(t)
          x=base/'res/layout/activity_v4_dashboard.xml'
          if x.exists():
              q=x.read_text().replace('#121212','#0F111A').replace('#00E5FF','#4D648D').replace('#263238','#1E2235')
              x.write_text(q)
          forbidden=['AdvancedToolsActivity','ADVANCED APP CONTROL','OPEN ADVANCED TOOLS']
          hits=[]
          for p in base.rglob('*'):
              if p.is_file() and p.suffix in {'.kt','.java','.xml'}:
                  q=p.read_text(errors='ignore')
                  hits += [str(p)+': '+z for z in forbidden if z in q]
          if hits: raise SystemExit('Removed Advanced UI returned: '+str(hits))
          final=u.read_text()
          req=['0xFF0F111A','0xFF1E2235','0xFF4D648D','0xFFB8C3D6','RoundedCornerShape(4.dp)']
          missing=[z for z in req if z not in final]
          bad=[z for z in ['0xFF00E5FF','RoundedCornerShape(12.dp)','RoundedCornerShape(50)'] if z in final]
          if missing or bad: raise SystemExit('Unified UI audit failed missing='+str(missing)+' forbidden='+str(bad))
          print('UNIFIED UI AUDIT PASSED')
          PY
      - name: Preserve highest-quality ShadowFox logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          res=Path('extracted/app/src/main/res'); exts={'.png','.webp','.jpg','.jpeg'}
          current=[p for p in res.rglob('shadowfox_logo.*') if p.suffix.lower() in exts]
          sources=[(p.stat().st_size,p.read_bytes(),p.name) for p in current]
          z=Path('ShadowFoxTV-FastTaskKiller-Project-v3.0.1-REAL-LOGO.zip')
          if z.exists():
            with zipfile.ZipFile(z) as f:
              for n in f.namelist():
                q=Path(n)
                if q.name.lower().startswith('shadowfox_logo.') and q.suffix.lower() in exts:
                  data=f.read(n); sources.append((len(data),data,q.name))
          if not sources: raise SystemExit('No ShadowFox logo found')
          _,data,name=max(sources,key=lambda x:x[0])
          for q in current:
            if q.exists(): q.unlink()
          dst=res/'drawable-nodpi'/name; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
          print('Using high-resolution logo',name,len(data),'bytes')
          PY
      - name: Build trigger v6.1.30 unified UI
        run: echo "Building v6.1.30 unified main-page UI"
      - name: Read version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' extracted/app/build.gradle)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare release signing
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        run: |
          printf '%s' "$SHADOWFOX_SIGNING_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/shadowfox-release.keystore.enc -out "$RUNNER_TEMP/shadowfox-release.keystore" -pass stdin
          echo "SHADOWFOX_KEYSTORE_PATH=$RUNNER_TEMP/shadowfox-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        working-directory: extracted
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Optimizer-v${{ env.APP_VERSION }}-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed release APK
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Optimizer-v${{ env.APP_VERSION }}
          path: extracted/app/build/outputs/apk/release/app-release.apk
      - name: Publish release
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          TAG="v${APP_VERSION}"; ASSET="ShadowFox-TV-Optimizer-v${APP_VERSION}.apk"
          cp extracted/app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$ASSET" --clobber; else gh release create "$TAG" "$ASSET" --title "ShadowFox TV Optimizer v${APP_VERSION}" --notes "ShadowFox H96 ANR fix build."; fi
