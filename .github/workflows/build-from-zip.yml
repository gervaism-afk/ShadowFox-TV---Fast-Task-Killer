name: Build & Release ShadowFox TV Optimizer

on:
  workflow_dispatch:
  push:
    branches: [main, v6.3.1-mobile-device-polish, android-tv-reference-ui, shadowfox-v6-ultimate, v6.0.3-layout-final, h96-diagnostic-build, h96-anr-fix-v6.1.10, ui-focus-v6.1.11, ultimate-dpad-unified-v6.1.12, accuracy-audit-v6.1.13, auto-updater-v6.1.14, production-cleanup-v6.1.16, rollback-v6.2.1-to-v6.1.16, true-ui-rebuild-v6.2.2, v6.3.2-mobile-landscape-fix, v6.4.0-ultimate-center-polish, v6.4.1-ultimate-center-layout-fix, v6.5.0-ultimate-tools-polish, v6.6.0-tv-rebuild, v6.6.1-update-feedback, v6.7.0-tv-metallic-rebuild, v6.7.1-tv-contrast-root-fix, v6.8.0-reference-layout-rebuild, v6.8.1-tv-focus-controls, v6.8.2-optimize-qa-fix, v6.8.3-optimize-state-fix, v6.8.4-optimize-survival-fix, v6.8.5-optimize-service-fix, v6.8.6-optimize-deadlock-fix, v6.8.7-optimize-stale-state-fix, v6.8.8-optimize-race-fix, v6.8.9-optimize-result-ui, v6.8.10-direct-optimize-result, v6.8.11-tv-optimize-results, v6.8.12-optimize-results-fit, v6.8.13-optimize-result-slot, v6.8.14-focus-regression-fix, v6.8.15-optimize-results-visible, v6.8.16-root-process-detection, v6.8.17-h96-dumpsys-processes, v6.8.18-h96-diagnostics, v6.8.19-root-shell-unification, stabilization-v6.9.0-audit, tv-v6-metallic-modernization]
    paths: ["overrides/**", "scripts/**", "signing/**", ".github/workflows/build-from-zip.yml"]

permissions:
  contents: write

env:
  SHADOWFOX_SIGNING_PASSWORD: ${{ secrets.SHADOWFOX_SIGNING_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: mkdir extracted && unzip -q ShadowFoxTV-FastTaskKiller-Project-v3.0.4-NON-ROOT.zip -d extracted
      - name: Apply authoritative ShadowFox source
        run: |
          # The legacy ZIP supplies only the Gradle wrapper/root build scaffold.
          # Never allow stale app source/resources from that ZIP into the APK.
          rm -rf extracted/app/src
          cp -R overrides/app/. extracted/app/.
          # Compose is the production UI. Remove obsolete pre-Compose XML layouts so
          # they cannot pull legacy ZIP resources/classes back into the build.
          rm -rf extracted/app/src/main/res/layout extracted/app/src/main/res/layout-port
          rm -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/V4DashboardActivity.java
          rm -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/LatencyGraphView.java
          rm -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/SpeedGaugeView.java
          rm -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/UpdateCenterButton.java
          rm -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/AdvancedToolsActivity.kt
          rm -f extracted/app/src/main/res/drawable/button_primary_tv.xml
          rm -f extracted/app/src/main/res/drawable/button_secondary_tv.xml
          rm -f extracted/app/src/main/res/drawable/optimizer_button.xml
          rm -f extracted/app/src/main/res/drawable/optimizer_panel.xml
          rm -f extracted/app/src/main/res/drawable/stat_tile.xml
          rm -f extracted/app/src/main/res/drawable/success_circle.xml
          rm -f extracted/app/src/main/res/drawable/tech_panel.xml
          rm -f extracted/app/src/main/res/drawable/tech_stat_tile.xml
          test -d extracted/app/src/main/java/ca/shadowfoxtv/taskkiller
          test -f extracted/app/src/main/AndroidManifest.xml
          if find extracted/app/src/main/java/ca/shadowfoxtv/taskkiller -name 'MainActivity.java' -print -quit | grep -q .; then
            echo 'ERROR: stale Java MainActivity leaked into authoritative source'
            exit 1
          fi
      - name: Preserve Android TV reference source
        run: |
          test -f extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
          grep -q 'SYSTEM SCAN' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
      - name: Verify Android TV presentation layer
        run: |
          grep -q 'SYSTEM SCAN' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
          grep -q 'ULTIMATE CENTER' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
          grep -q 'RAM BOOSTER' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
          grep -q 'CHECK FOR UPDATES' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/UltimateCenterActivity.kt
          grep -q 'TV_V6_ULTIMATE_REBUILD_693' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/UltimateCenterActivity.kt
      - name: Verify authoritative source boundary
        run: |
          test ! -e extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/OptimizeService.kt
          test ! -e extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/V4DashboardActivity.java
          test ! -e extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/AdvancedToolsActivity.kt
          grep -q 'android:name=".ShadowFoxApp"' extracted/app/src/main/AndroidManifest.xml
          grep -q 'ShadowFoxProEngine' extracted/app/src/main/java/ca/shadowfoxtv/taskkiller/MainActivity.kt
      - name: Preserve exact HQ ShadowFox logo
        run: |
          test -f extracted/app/src/main/res/drawable-nodpi/shadowfox_logo_hq.png
          rm -f extracted/app/src/main/res/drawable-nodpi/shadowfox_logo.png
          cp extracted/app/src/main/res/drawable-nodpi/shadowfox_logo_hq.png extracted/app/src/main/res/drawable-nodpi/shadowfox_logo.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('extracted/app/src/main/res/drawable-nodpi/shadowfox_logo.png')
          data=p.read_bytes()
          if not data.startswith(b'\x89PNG\r\n\x1a\n'):
              raise SystemExit('HQ ShadowFox logo is not a PNG')
          if len(data) < 500000:
              raise SystemExit('HQ ShadowFox logo unexpectedly small')
          print('Using exact uploaded HQ ShadowFox logo:', len(data), 'bytes')
          PY
      - name: Generate transparent Optimizer launcher identity
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          res=Path('extracted/app/src/main/res')
          logo=Image.open(res/'drawable-nodpi'/'shadowfox_logo.png').convert('RGBA')
          logo=logo.crop(logo.getchannel('A').getbbox())
          fp=next(p for p in ['/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf','/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf'] if Path(p).exists())
          label='OPTIMIZER'

          # Transparent master. Artwork deliberately fills the tile for TV viewing.
          master=Image.new('RGBA',(1024,1024),(0,0,0,0))
          maxw,maxh=900,700
          s=min(maxw/logo.width,maxh/logo.height)
          art=logo.resize((int(logo.width*s),int(logo.height*s)),Image.Resampling.LANCZOS)
          master.alpha_composite(art,((1024-art.width)//2,35))
          d=ImageDraw.Draw(master)
          f=ImageFont.truetype(fp,116)
          bb=d.textbbox((0,0),label,font=f,stroke_width=3); tw=bb[2]-bb[0]
          d.text(((1024-tw)//2,800),label,font=f,fill=(230,252,255,255),
                 stroke_width=5,stroke_fill=(0,82,135,255))

          for density,size in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              q=res/f'mipmap-{density}'; q.mkdir(parents=True,exist_ok=True)
              icon=master.resize((size,size),Image.Resampling.LANCZOS)
              icon.save(q/'ic_launcher.png',optimize=True)
              icon.save(q/'ic_launcher_round.png',optimize=True)

          # Transparent Android TV banner, with embedded product identity.
          banner=Image.new('RGBA',(640,360),(0,0,0,0))
          s=min(520/logo.width,245/logo.height)
          a=logo.resize((int(logo.width*s),int(logo.height*s)),Image.Resampling.LANCZOS)
          banner.alpha_composite(a,((640-a.width)//2,0))
          bd=ImageDraw.Draw(banner); bf=ImageFont.truetype(fp,58)
          bb=bd.textbbox((0,0),label,font=bf,stroke_width=2)
          bd.text(((640-(bb[2]-bb[0]))//2,285),label,font=bf,fill=(230,252,255,255),
                  stroke_width=3,stroke_fill=(0,82,135,255))
          banner.resize((320,180),Image.Resampling.LANCZOS).save(res/'drawable-nodpi'/'shadowfox_tv_banner.png',optimize=True)
          print('Generated transparent ShadowFox TV Optimizer launcher assets')
          PY
      - name: Read version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' extracted/app/build.gradle)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: extracted
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare release signing
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        run: |
          printf '%s' "$SHADOWFOX_SIGNING_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/shadowfox-release.keystore.enc -out "$RUNNER_TEMP/shadowfox-release.keystore" -pass stdin
          echo "SHADOWFOX_KEYSTORE_PATH=$RUNNER_TEMP/shadowfox-release.keystore" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        working-directory: extracted
        run: gradle :app:assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Optimizer-v${{ env.APP_VERSION }}-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed release APK
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-TV-Optimizer-v${{ env.APP_VERSION }}
          path: extracted/app/build/outputs/apk/release/app-release.apk
      - name: Publish release
        if: ${{ env.SHADOWFOX_SIGNING_PASSWORD != '' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          TAG="v${APP_VERSION}"; ASSET="ShadowFox-TV-Optimizer-v${APP_VERSION}.apk"
          cp extracted/app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" "$ASSET" --clobber; else gh release create "$TAG" "$ASSET" --title "ShadowFox TV Optimizer v${APP_VERSION}" --notes "ShadowFox H96 ANR fix build."; fi


