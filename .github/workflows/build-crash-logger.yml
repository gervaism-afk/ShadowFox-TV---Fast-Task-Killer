name: Build ShadowFox Crash Logger

on:
  push:
    branches: [shadowfox-crash-logger]
    paths: ["crash-logger/**", ".github/workflows/build-crash-logger.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Crash Logger APK
        working-directory: crash-logger
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp crash-logger/app/build/outputs/apk/debug/app-debug.apk ShadowFox-H96-Crash-Logger-v1.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadowFox-H96-Crash-Logger-v1.3
          path: ShadowFox-H96-Crash-Logger-v1.3.apk
